

name: Android CI Bionic

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Clone repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Install mingw-w64 toolchain
      run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

    - name: Build refactorsize.exe
      run: |
        mkdir -p app/src/main/assets/refactorsize
        x86_64-w64-mingw32-windres app/src/main/cpp/wn-refactor-size/refactorsize.rc -O coff -o refactorsize.res.o
        x86_64-w64-mingw32-gcc -O2 -s -mwindows app/src/main/cpp/wn-refactor-size/refactorsize.c refactorsize.res.o -o app/src/main/assets/refactorsize/refactorsize.exe -luser32
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Attach release in action
      uses: actions/upload-artifact@v4
      with:
       name: Winlator Bionic apk
       path: ./app/build/outputs/apk/debug/app-debug.apk

    - name: "Get Short SHA"
      run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: "Get Version"
      run: echo "VERSION=$(echo $(cat app/build.gradle.kts | grep versionName | cut -d "=" -f 2 | sed "s/\"//g"))" >> $GITHUB_ENV

    - name: "List files"
      run: |
        ls -la app/src/main/assets


    
