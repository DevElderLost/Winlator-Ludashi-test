pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // Maven Central rate-limits CI runners (HTTP 429). Robolectric's host-JVM runtime
        // jars come from Google's Maven Central mirror first; everything else is unchanged.
        maven {
            url = uri('https://maven-central.storage-download.googleapis.com/maven2/')
            content { includeGroup('org.robolectric') }
        }
        google()
        mavenCentral()
    }
}

rootProject.name = "Winlator"
include ':app'
